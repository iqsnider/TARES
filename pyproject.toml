[project]
name = "TARES"
version = "0.1.0"
description = "Tethered Aerial Radiation Estimation System (TARES)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "opencv-contrib-python>=5.0.0.93",
    "pandas>=3.0.3",
    "pymavlink>=2.4.49",
    "pyqt6>=6.11.0",
    "pyserial>=3.5",
    "python-socketio>=5.16.3",
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim",
    "src/comms",
    "src/logs",
    "Prm"]
