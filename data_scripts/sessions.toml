# What the filenames cannot tell you.
#
# catalog.py derives everything it can from the data directory itself.
# Geometry comes off each session's own config_snapshot.json, and the
# pose/flight clock offset off the wall clock both logs stamp on every row.
# This file holds only what's left: your own notes, and which of a handful
# of old runs came out of the simulator. Keys under [sessions.<id>] reach
# you as session.<name>:
#
#     s = catalog.resolve("07232026.last")
#     s.note   -> "23 Jul 2026, last test of the day"
#
# Add a session by copying a stamp out of `uv run plot.py ls`.

[sessions.20260723_114556]
note = "23 Jul 2026, last test of the day"


# ArduPilot SITL, not real flights. These five were filed twice -- under
# data_06302026/data/ and again under a folder named SITL/ -- and the
# byte-identical SITL/ copies were deleted, so `sim = true` is now the only
# thing recording that they came out of the simulator. Filter them out of a
# listing with `uv run plot.py ls 06302026.real`.
[sessions.20260630_105624]
sim = true
[sessions.20260630_111010]
sim = true
[sessions.20260630_113409]
sim = true
[sessions.20260630_113908]
sim = true
[sessions.20260630_122056]
sim = true
